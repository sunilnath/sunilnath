name: Generate GitHub Stats

on:
  schedule:
    - cron: '0 0 * * *'   # daily at midnight UTC
  workflow_dispatch:      # manual trigger

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v3

      - name: Generate Streak SVG
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}  # GitHub Personal Access Token
        run: |
          # Download streak SVG with private repo count
          curl -H "Authorization: token $GH_TOKEN" -o streak.svg "https://streak-stats.demolab.com/?user=sunilnath&theme=dark&hide_border=true"

      - name: Commit & Push SVG
        run: |
          git config --global user.name "github-actions"
          git config --global user.email "github-actions@github.com"
          git add streak.svg
          git commit -m "Update streak stats" || echo "No changes to commit"
          git push
